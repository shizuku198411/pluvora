name: kernel-dev
base: ubuntu@24.04

sdks:
  - name: rust
    channel: latest/stable
  
  - name: project-kernel-dev-base

actions:
  # boot test without kernel image
  qemu-boot-test: |
    qemu-system-riscv64 \
      -M virt \
      -m 256M \
      -nographic \
      -bios opensbi/build/platform/generic/firmware/fw_jump.bin

  # build kernel image
  build: |
    cd kernel
    cargo fmt --check
    cargo clippy --release -- -D warnings
    cargo build --release

  # apply Rust formatting fixes
  format: |
    cd kernel
    cargo fmt
  
  # check elf
  check-elf: |
    llvm-readelf -h -l kernel/target/riscv64imac-unknown-none-elf/release/Pluvora-kernel
  
  # run kernel on qemu
  run-kernel: |
    qemu-system-riscv64 \
      -machine virt \
      -m 256M \
      -smp 4 \
      -nographic \
      -bios opensbi/build/platform/generic/firmware/fw_jump.bin \
      -kernel kernel/target/riscv64imac-unknown-none-elf/release/Pluvora-kernel

  # run every currently implemented Rust and QEMU test
  test-all: |
    bash scripts/test.sh all

  # run host-side Rust logic tests; optionally pass a name filter
  test-rust: |
    bash scripts/test.sh rust "$@"

  # run Python-driven QEMU tests; optionally pass a name filter
  test-qemu: |
    bash scripts/test.sh qemu "$@"

  # run one category and optional filter: test-one rust|qemu [filter]
  test-one: |
    bash scripts/test.sh "$@"
